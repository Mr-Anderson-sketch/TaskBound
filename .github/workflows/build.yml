name: Build installers

# Manual or on a version tag (v1.2.0). Not on every push, so Actions minutes are only spent on purpose.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos-arm64
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run lint

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npm run build:tauri

      - uses: actions/upload-artifact@v4
        with:
          name: timebound-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
